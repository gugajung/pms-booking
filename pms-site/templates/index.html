<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoSlope Lab | Estabilidade de Taludes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <header>
    <p class="eyebrow">GeoTech Studio</p>
    <h1>GeoSlope Lab</h1>
    <p class="sub">MVP inspirado no fluxo de análise de estabilidade: busca de superfície circular crítica com Bishop simplificado e geração de laudo.</p>
  </header>

  <main>
    <section class="card">
      <h2>Entrada de Dados</h2>
      <form id="analysisForm" class="grid">
        <label>Altura H (m)<input name="height" type="number" step="0.1" value="20" required></label>
        <label>Inclinação β (graus)<input name="beta_deg" type="number" step="0.1" value="40" required></label>
        <label>Berma no topo (m)<input name="crest_width" type="number" step="0.1" value="16" required></label>

        <label>Peso específico γ (kN/m³)<input name="gamma" type="number" step="0.1" value="20" required></label>
        <label>Coesão c' (kPa)<input name="cohesion" type="number" step="0.1" value="25" required></label>
        <label>Ângulo de atrito φ' (graus)<input name="phi_deg" type="number" step="0.1" value="30" required></label>

        <label>Coef. poropressão rᵤ<input name="ru" type="number" step="0.01" value="0.15" min="0" max="0.9" required></label>
        <label>Fatias<input name="n_slices" type="number" step="1" value="24" min="5" max="80" required></label>
        <label>Grade de busca X<input name="grid_x" type="number" step="1" value="20" min="8" max="50" required></label>
        <label>Grade de busca Y<input name="grid_y" type="number" step="1" value="16" min="8" max="50" required></label>

        <div class="actions">
          <button type="submit">Rodar análise</button>
          <button type="button" id="btnReport" class="outline" disabled>Gerar laudo</button>
        </div>
      </form>
      <p id="status" class="hint"></p>
    </section>

    <section class="card viewer">
      <div class="result-head">
        <h2>Resultado</h2>
        <div id="fsBadge" class="fs-badge">FS: --</div>
      </div>
      <canvas id="slopeCanvas" width="960" height="420"></canvas>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>FS</th>
            <th>Centro (x,y)</th>
            <th>Raio</th>
          </tr>
        </thead>
        <tbody id="topTable"></tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
